<div class="profile-loading">
  <div class="profile-loading__status" role="status">
    <span class="profile-loading__emblem" aria-hidden="true"
      ><img src="/img/reward.png" width="40" height="40" alt=""
    /></span>
    <div>
      <strong>Opening the vault…</strong>
      <p>Gathering player details, companion stats, and rewards.</p>
    </div>
  </div>
  <div class="profile-loading__preview" aria-hidden="true">
    <div class="profile-loading__player">
      <span class="skeleton profile-loading__avatar"></span>
      <div>
        <span class="skeleton profile-loading__name"></span
        ><span class="skeleton profile-loading__detail"></span>
      </div>
    </div>
    <div class="profile-loading__stats">
      <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
    </div>
    <span class="skeleton profile-loading__heading"></span>
    <div class="profile-loading__rewards">
      <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span
      ><span class="skeleton"></span>
    </div>
  </div>
</div>
